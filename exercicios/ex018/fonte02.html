<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>

    <style>

        @font-face {
            font-family: 'Asia';
            src: url('fonts/Spell of Asia.ttf') format(truetype);
            font-weight: normal;
            font-style: normal;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            font-family: 'Asia', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Exemplo de título</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Ratione, ea modi exercitationem minima maiores sint, ad, omnis molestias nisi similique vel. Odio rerum vitae deserunt porro dignissimos ipsa dolor recusandae.</p>
    
</body>
</html>
