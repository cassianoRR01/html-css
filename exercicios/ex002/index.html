<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
    <h1>Parágrafos e quebras de linha</h1>
    <hr>
    <p>Você pode escrever o que 
        quiser no parágrafo desde 
        que esteja dentro das tags 
        &lt;p&gt; e &lt;/p&gt;.
    </p>
    <p>Caso queira quebrar o texto em algum lugar <br> como esse, basta usar a tag &lt;br&gt;.</p> 
    <p>Adicionando alguns símbolos:
        &copy;
        &cent;
        &trade;
        &rarr;

    </p>
    <p>Adicionando alguns emojis:
        &#x1F62D;
        &#x1F525;
        &#x1F351;
    </p>
</body>
</html>
