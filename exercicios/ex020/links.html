<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>

        /*
        Seletores Personalizados 

        # = id
        . = class
        : = pseudo-class
        :: = pseudo- element
        > = children
        */
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: rgb(99, 99, 253);
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: blue;
        }

        a:hover {
            text-decoration: underline;
        }

        a:active {
            color: black;
            text-decoration: underline
        }

        a::after {
            content: '🔗';
            font-weight: normal;
            }
    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://www.youtube.com/" target="_blank">YouTube</a></li>
        <li><a href="https://www.facebook.com/?locale=pt_BR" target="_blank">FaceBook</a></li>
        <li><a href="https://web.whatsapp.com/" target="_blank">WhatsApp</a></li>
    </ul>
    
</body>
</html>
