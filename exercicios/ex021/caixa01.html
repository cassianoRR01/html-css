<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        h1 {
            background-color: lightsalmon;
            height: 300px;
            width: 300px;
            
            border: 10px solid rgb(241, 107, 54);

            padding: 20px 20px 40px 20px;

            margin: 10px auto;
            
            outline: 3px dotted black;
        }

        a {
            border-width: 5px;
            border-color: lightcoral;
            border-style: solid;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Os parágrafos tambem são caixas box-level, porem, os <a href="#">linkas são caixas inline-level</a> vamos ver na prática</p>
    
</body>
</html>
