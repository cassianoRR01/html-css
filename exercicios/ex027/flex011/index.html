<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
        }

        div.items {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 200px;
        }

        #a {
            flex-basis: 100px;
            flex-grow: 1;
            flex-shrink: 0;
        }

        #b {
            flex-basis: 100px;
            flex-grow: 2;
            flex-shrink: 1;
        }

        #c {
            flex-basis: 100px;
            flex-grow: 3;
            flex-shrink: 2;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="items" id="a">A</div>
        <div class="items" id="b">B</div>
        <div class="items" id="c">C</div>
    </div>
    
</body>
</html>
